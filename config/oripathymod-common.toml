
[bod]
	#Blood Originium-Crystal Density (u/L)
	#Initial minimum BOD
	#Range: 0.0 ~ 10.0
	min_initial = 0.1
	#Amount of BOD recovered per interval (Conditional Recovery)
	#Range: 0.0 ~ 1.0
	recovery_rate = 0.001
	#Natural BOD recovery per second (Passive)
	#Range: 0.0 ~ 1.0
	natural_recovery = 2.0E-4
	#BOD gain per second in contaminated area
	#Range: 0.0 ~ 1.0
	gain_contaminated_area = 5.0E-4
	#Seconds between each recovery tick
	#Range: 1 ~ 600
	recovery_interval = 5
	#Seconds required to be safe before recovery starts
	#Range: 0 ~ 3600
	recovery_condition_time = 300
	#BOD above min_bod + this value triggers risk
	#Range: 0.0 ~ 5.0
	threshold_risk_delta = 0.03

[coa]
	#Cell-Originium Assimilation (Percent)
	#Base COA gain when risk timer hits (Percent value, e.g. 0.1)
	#Range: 0.0 ~ 100.0
	gain_base = 0.1
	#COA gain when mild infection (Percent value, e.g. 0.2)
	#Range: 0.0 ~ 100.0
	gain_mild = 0.2
	#COA gain when severe infection (Percent value, e.g. 0.3)
	#Range: 0.0 ~ 100.0
	gain_severe = 0.3
	#Magic damage bonus percent per 1% COA
	#Range: 0 ~ 100
	magic_bonus_perc = 5
	#COA percent that triggers death
	#Range: 0.0 ~ 100.0
	death_value = 20.0
	#Seconds in risk zone before COA increases
	#Range: 1 ~ 3600
	risk_to_coa_seconds = 60
	#Minimum amount Min BOD increases when COA increases
	#Range: 0.0 ~ 1.0
	minBod_increase_min = 0.01
	#Maximum amount Min BOD increases when COA increases
	#Range: 0.0 ~ 1.0
	minBod_increase_max = 0.02
	#COA threshold (%) where natural recovery is penalized
	#Range: 0.0 ~ 100.0
	threshold_recovery_penalty = 10.0
	#Multiplier for recovery when above COA threshold (0.5 = 50% slower)
	#Range: 0.0 ~ 1.0
	recovery_penalty_multiplier = 0.5

[symptoms]
	#Symptom tuning values
	#COA % for Level 1 Symptoms (Respiratory Start)
	#Range: 0.0 ~ 100.0
	coa_start_level_1 = 5.0
	#COA % for Level 2 Symptoms (Musculoskeletal Start)
	#Range: 0.0 ~ 100.0
	coa_start_level_2 = 10.0
	#COA % for Level 3 Symptoms (Cardiovascular Start)
	#Range: 0.0 ~ 100.0
	coa_start_level_3 = 15.0
	#COA % for Level 4 Symptoms (Critical State Start)
	#Range: 0.0 ~ 100.0
	coa_start_level_4 = 20.0
	#BOD for Mild Mental Symptoms Start
	#Range: 0.0 ~ 10.0
	bod_mild_threshold = 0.3
	#BOD for Severe Mental Symptoms Start (Random Specific Symptom)
	#Range: 0.0 ~ 10.0
	bod_severe_threshold = 0.4
	#BOD for Max Mental Symptom Intensity
	#Range: 0.0 ~ 10.0
	bod_max_threshold = 0.5

[ui]
	#UI Colors (Hex integers)
	#Range: 0 ~ 16777215
	color_safe = 65280
	#Range: 0 ~ 16777215
	color_warning = 16776960
	#Range: 0 ~ 16777215
	color_danger = 16711680

[sync]
	#Server to client sync interval in ticks
	#Range: 1 ~ 1200
	sync_interval_ticks = 20

[general]
	#Allow a last chance item to prevent death
	allow_last_chance_item = false
	#Item ID for last chance item
	last_chance_item_id = "oripathymod:detox_tonic"
	#Reset BOD to minBod on respawn
	reset_bod_on_respawn = false
	#Enable debug logging
	debug = false
	#List of item registry names that trigger magic use
	integration_whitelist = ["irons_spellbooks:scroll", "ars_nouveau:spell_book"]
	#Duration of suppressant effect in seconds
	#Range: 1 ~ 3600
	suppressant_duration = 300

[social]
	#Village Social System (Discrimination)
	#Probability that a villager has discrimination trait (0.0 - 1.0)
	#Range: 0.0 ~ 1.0
	villager_discrimination_chance = 0.8
	#Probability that an Iron Golem ignores infected players (0.0 - 1.0)
	#Range: 0.0 ~ 1.0
	golem_ignore_infected_chance = 0.5
	#Trade price multiplier for discriminated players (e.g., 65 means add 64 to price)
	#Range: 1 ~ 256
	trade_price_multiplier = 65
	#List of mod IDs whose entities are excluded from infection
	excluded_mod_ids = ["create", "supplementaries"]
	#List of Origin IDs that are discriminated against
	discriminated_origins = ["origins:phantom", "origins:arachnid"]

[combat_balance]
	#Combat Balance & Melee Dust Mitigation
	#Required proportion of melee damage (0.0 to 1.0) to trigger clean kill (prevent dust/contamination on death)
	#Range: 0.0 ~ 1.0
	melee_clean_kill_ratio = 0.7
	#Whether heavy/charged melee attacks clear originium dust & contamination at impact site
	heavy_attack_clears_dust = true
	#Spell power bonus multiplier per 1% COA for Iron's Spells integration (e.g. 0.02 = +2% per 1% COA)
	#Range: 0.0 ~ 10.0
	iron_spells_spell_power_bonus = 0.02

