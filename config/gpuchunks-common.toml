
[gpu]
	#Master GPU enable/disable switch
	gpuEnabled = false
	#When true, CPU Fallback is always used when GPU result is unavailable
	#This ensures terrain is identical regardless of GPU timing
	strictParity = false
	#Specific GPU device to use (partial name match).
	#Leave empty to auto-select the best available GPU.
	#Example: 'NVIDIA GeForce RTX 3060'
	gpuDeviceName = "AMD Radeon RX 7800 XT"

[prefetch]
	#Prefetch mode: ASYNC, SYNC_CENTER, SYNC_RADIUS1, SYNC_ALL
	#SYNC_CENTER = best balance of hit rate and latency
	#Allowed Values: ASYNC, SYNC_CENTER, SYNC_RADIUS1, SYNC_ALL
	mode = "ASYNC"

[batch]
	#Number of chunks to process in a single GPU batch
	#Higher values = better throughput, but more VRAM
	#Range: 2 ~ 8
	batchSize = 4
	#Maximum allowed batch size
	#Range: 2 ~ 16
	maxBatchSize = 8
	#Minimum batch size
	#Range: 1 ~ 4
	minBatchSize = 2

[adaptive]
	#Enable adaptive prefetch radius based on player speed
	enabled = true
	#Minimum adaptive radius (Parity safety floor)
	#Range: 1 ~ 5
	minRadius = 2
	#Maximum adaptive radius (for fast movement like elytra)
	#Range: 2 ~ 10
	maxRadius = 5
	#Current adaptive prefetch radius (auto-adjusted)
	#Range: 1 ~ 10
	prefetchRadius = 3
	#Consider player look direction in predictions
	useLookDirection = true

[cache]
	#Maximum density cache size (number of chunks)
	#Higher values use more RAM but improve performance
	#Range: 64 ~ 1024
	densityCacheSize = 256
	#Enable density stage cache
	densityCacheEnabled = true

[halfPrecision]
	#Use half-precision (16-bit) storage for noise data
	#Reduces memory by 50% but may reduce accuracy
	#IMPORTANT: This is STORAGE ONLY. All computation uses float32
	enabled = false
	#Maximum acceptable error for half precision
	#Range: 1.0E-4 ~ 0.01
	errorThreshold = 0.001

[persistentCache]
	#Enable persistent cache (disk storage)
	enabled = true
	#Maximum cache size in MB (LRU purge when exceeded)
	#Range: 256 ~ 10240
	maxSizeMB = 2048
	#Maximum cache age in days (auto-delete older files)
	#Range: 1 ~ 365
	maxAgeDays = 30
	#Enable boundary smoothing for quantized data
	#WARNING: This may affect Parity. Disabled in strict parity mode
	boundarySmoothingEnabled = false

[mode]
	#GPU execution mode:
	#SAFE = BlendedNoise GPU only (stable, recommended)
	#FAST = Full DensityFunction JIT (experimental, faster)
	#Allowed Values: SAFE, FAST, ULTRA_FAST
	gpuMode = "ULTRA_FAST"
	#Maximum allowed difference between GPU and CPU values.
	#If exceeded, JIT result is discarded and CPU fallback is used.
	#Only applies to FAST mode.
	#Range: 1.0E-5 ~ 0.01
	jitParityThreshold = 1.0E-4
	#Prefetch radius for SAFE mode (in chunks).
	#Higher values load more chunks but use more resources.
	#Default: 8
	#Range: 1 ~ 32
	safePrefetchRadius = 8
	#Prefetch radius for FAST mode (in chunks).
	#Higher values load more chunks but use more resources.
	#Default: 12
	#Range: 1 ~ 32
	fastPrefetchRadius = 12
	#Prefetch radius for ULTRA_FAST mode (in chunks).
	#Set to 0 to use server's render distance.
	#Otherwise this value overrides render distance.
	#Range: 0 ~ 64
	ultraFastPrefetchRadius = 0
	#Maximum VRAM reservation for ULTRA_FAST mode (in MB).
	#WARNING: iGPU/4GB GPU/Laptop/Shader users may crash!
	#Set to 0 for auto-detection (25% of available VRAM, max 1GB).
	#Range: 0 ~ 4096
	ultraFastMaxVramMB = 0
	#Maximum faces per chunk before fail-fast triggers.
	#Chunks exceeding this generate DebugPattern instead.
	#Range: 4096 ~ 262144
	ultraFastMaxFacesPerChunk = 65536
	#Kernel timeout in milliseconds (prevents TDR crashes).
	#Kernels exceeding this are forcibly aborted.
	#Range: 10 ~ 5000
	ultraFastKernelTimeoutMs = 100
	#Enable real-time GPU stats overlay in ULTRA_FAST mode.
	ultraFastDebugOverlay = true
	#Target chunks per second (0 = unlimited).
	#Limits generation speed to save power/reduce heat.
	#Range: 0 ~ 1000
	ultraFastThroughputTarget = 0
	#Max complexity for SAFE mode (if JIT enabled)
	#Default: 100
	#Range: 10 ~ 5000
	jitComplexitySafe = 100
	#Max complexity for FAST mode
	#Default: 1000 (increased for Terralith)
	#Range: 10 ~ 20000
	jitComplexityFast = 200
	#Max complexity for ULTRA_FAST mode
	#Default: 32000 (increased for Tectonic)
	#Range: 10 ~ 100000
	jitComplexityUltraFast = 16000
	#Maximum recursion depth for nested splines.
	#Increase for complex modpacks (Terralith+Tectonic).
	#Default: 12
	#Range: 5 ~ 50
	splineRecursionDepth = 12
	#Timeout (ms) to wait for JIT result before failing back to CPU.
	#Increase if complex terrain (Terralith) causes low hit rate.
	#FAST mode default: 1000ms
	#Range: 10 ~ 5000
	jitWaitTimeoutMs = 200

